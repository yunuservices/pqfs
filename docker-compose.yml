services:
  pqfs:
    build: .
    container_name: pqfs
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    volumes:
      - pqfs-backend:/data
    command: sleep infinity
    stdin_open: true
    tty: true

  smoke-test:
    build: .
    container_name: pqfs-smoke-test
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    volumes:
      - pqfs-backend:/data
    command: >
      sh -c '
        set -e
        mkdir -p /mnt/pqfs
        echo "[*] Mounting pqfs..."
        pqfs /data /mnt/pqfs --password smoke-test &
        sleep 2
        echo "[*] Writing test files..."
        echo "hello from pqfs" > /mnt/pqfs/hello.txt
        mkdir /mnt/pqfs/dir
        echo "nested content" > /mnt/pqfs/dir/nested.txt
        echo "[*] Reading back..."
        cat /mnt/pqfs/hello.txt
        cat /mnt/pqfs/dir/nested.txt
        echo "[*] Listing files..."
        ls -la /mnt/pqfs
        echo "[*] Unmounting..."
        fusermount3 -u /mnt/pqfs || true
        echo "[*] Smoke test complete."
      '
    profiles:
      - test

volumes:
  pqfs-backend:
