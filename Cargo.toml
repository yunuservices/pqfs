[package]
name = "pqfs"
version = "0.1.0"
edition = "2024"
authors = ["yunuservices <yunuservices@gmail.com>"]
description = "A hybrid post-quantum FUSE filesystem in Rust (research prototype)"
license = "MIT"
repository = "https://github.com/yunuservices/pqfs"

[features]
default = ["ml-kem-768"]
ml-kem-512 = []
ml-kem-768 = []
ml-kem-1024 = []

[dependencies]
anyhow = "1.0.103"
argon2 = "0.5.3"
bincode = "1.3.3"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.2", features = ["derive", "env"] }
fuser = "0.14"
hkdf = "0.13.0"
hmac = "0.13.0"
libc = "0.2.186"
ml-kem = { version = "0.3.2", features = ["getrandom"] }
rand = "0.10.2"
rpassword = "7"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
